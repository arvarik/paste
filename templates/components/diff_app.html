    <!-- Diff App Container -->
	    <main id="app-diff" aria-hidden="true" inert class="app-shell flex-1 flex flex-col overflow-hidden w-full h-full absolute inset-0 transition-opacity duration-300 opacity-0 pointer-events-none z-0">
        <header class="app-header h-16 px-3 sm:px-10 flex items-center border-b border-gray-200 dark:border-dark-700 glass gap-2">
            <!-- Show sidebar: visible when sidebar is collapsed -->
	            <button id="show-sidebar-diff"
	                type="button" aria-controls="sidebar" aria-expanded="false"
	                class="icon-action show-sidebar-btn hidden flex-shrink-0 p-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-dark-700 rounded-lg transition-colors"
                aria-label="Show sidebar">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

	            <button id="mobile-diff-menu-btn"

                aria-label="Open menu">

                    class="bg-transparent text-lg sm:text-2xl font-bold text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 outline-none w-full transition-colors focus:border-b border-indigo-500 pb-1"

            <div class="flex items-center gap-1.5 sm:gap-3 ml-2 sm:ml-4 flex-shrink-0">
                <span id="diff-status-badge"
                    class="inline-flex px-2 sm:px-3 py-1 text-[10px] sm:text-xs font-medium rounded-full bg-gray-100 dark:bg-dark-700 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-dark-600 shadow-sm transition-all duration-300"

	                <button id="export-diff-btn" type="button" aria-label="Export diff with metadata"
	                    class="hidden items-center gap-2 rounded-lg border border-gray-300 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-dark-600 dark:text-gray-200 dark:hover:bg-dark-700">
	                    <svg aria-hidden="true" class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16V4m0 12-4-4m4 4 4-4M4 17v1a2 2 0 002 2h12a2 2 0 002-2v-1"></path></svg>
	                    <span class="hidden sm:inline">Export</span>
	                </button>
		                <button id="save-diff-btn"
	                    type="button" aria-label="Save diff"
	                    class="group relative px-3 sm:px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-sm transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none flex items-center gap-1.5 sm:gap-2 overflow-hidden"
                    disabled>
                    <span class="relative z-10 flex items-center gap-1.5 sm:gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                        </svg>
	                    <span class="hidden text-sm font-medium min-[360px]:inline">Save</span>
                    </span>
                    <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
                </button>
            </div>
	        </header>
	        <details id="diff-options" class="mx-3 mt-3 rounded-xl border border-gray-200 bg-white/70 dark:border-dark-700 dark:bg-dark-800/70 sm:mx-10">
	            <summary class="cursor-pointer select-none px-4 py-2.5 text-sm font-semibold text-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-indigo-500 dark:text-gray-200">

	            <div class="grid grid-cols-1 gap-4 border-t border-gray-200 p-4 dark:border-dark-700 sm:grid-cols-2 lg:grid-cols-4">
	                <div class="sm:col-span-2">
	                    <label for="diff-tags" class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">Tags</label>
	                    <input id="diff-tags" type="text" maxlength="2079" autocomplete="off" placeholder="review, release, draft"

	                        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 dark:border-dark-600 dark:bg-dark-700 dark:text-white">
	                    <p id="diff-tags-help" class="mt-1 text-xs text-gray-500 dark:text-gray-400">Separate up to 32 tags with commas.</p>
	                </div>
	                <div>
	                    <label for="diff-expires-at" class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">Expires at</label>
	                    <input id="diff-expires-at" type="datetime-local"
	                        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 dark:border-dark-600 dark:bg-dark-700 dark:text-white dark:[color-scheme:dark]">
	                </div>
	                <fieldset class="flex flex-col justify-center gap-3">
	                    <legend class="sr-only">Saved diff behavior</legend>
	                    <label class="flex cursor-pointer items-center gap-2 text-sm text-gray-700 dark:text-gray-200">
	                        <input id="diff-favorite" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">

	                    <label class="flex cursor-pointer items-center gap-2 text-sm text-gray-700 dark:text-gray-200">
	                        <input id="diff-burn-after-read" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-rose-600 focus:ring-rose-500">

	                    </label>
	                </fieldset>
	            </div>
	        </details>
	        <div class="flex-1 overflow-y-auto p-4 sm:p-10 flex flex-col gap-4 sm:gap-6 relative">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative z-10">
                <div class="flex flex-col gap-1.5 sm:gap-2">
	                    <label for="diff-base" class="text-xs sm:text-sm font-semibold text-gray-600 dark:text-gray-300"><span class="sm:hidden">Base</span><span class="hidden sm:inline">Base Paste ID / Content</span></label>
	                    <div class="editor-surface flex h-36 sm:h-64 border border-gray-200 dark:border-dark-700 rounded-xl overflow-hidden bg-gray-50 dark:bg-[#16191f] focus-within:ring-1 focus-within:ring-indigo-500">
	                        <div id="diff-base-lines" aria-hidden="true" class="editor-gutter w-8 sm:w-12 pr-2 sm:pr-3 py-3 sm:py-4 bg-gray-200/50 dark:bg-dark-800 text-gray-400 dark:text-gray-400 border-r border-gray-200 dark:border-dark-700">1</div>
                        <textarea id="diff-base" class="w-full h-full bg-transparent p-3 sm:p-4 text-xs sm:text-sm font-mono text-gray-800 dark:text-gray-200 focus:outline-none custom-scrollbar resize-none whitespace-pre leading-relaxed" wrap="off" placeholder="Paste ID or raw content..."></textarea>
                    </div>

                <div class="flex flex-col gap-1.5 sm:gap-2">
	                    <label for="diff-compare" class="text-xs sm:text-sm font-semibold text-gray-600 dark:text-gray-300"><span class="sm:hidden">Compare</span><span class="hidden sm:inline">Compare Paste ID / Content</span></label>
	                    <div class="editor-surface flex h-36 sm:h-64 border border-gray-200 dark:border-dark-700 rounded-xl overflow-hidden bg-gray-50 dark:bg-[#16191f] focus-within:ring-1 focus-within:ring-indigo-500">
	                        <div id="diff-compare-lines" aria-hidden="true" class="editor-gutter w-8 sm:w-12 pr-2 sm:pr-3 py-3 sm:py-4 bg-gray-200/50 dark:bg-dark-800 text-gray-400 dark:text-gray-400 border-r border-gray-200 dark:border-dark-700">1</div>
                        <textarea id="diff-compare" class="w-full h-full bg-transparent p-3 sm:p-4 text-xs sm:text-sm font-mono text-gray-800 dark:text-gray-200 focus:outline-none custom-scrollbar resize-none whitespace-pre leading-relaxed" wrap="off" placeholder="Paste ID or raw content..."></textarea>

            <div class="relative z-10 flex flex-wrap items-end justify-center gap-3">
                <div>

	                <button id="run-diff-btn" type="button" class="flex min-h-10 items-center gap-2 rounded-lg bg-indigo-600 px-6 py-2.5 font-medium text-white shadow-sm transition-all hover:bg-indigo-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>

	            <div id="diff-output-container" role="region" aria-label="Diff result" class="result-surface hidden mt-2 sm:mt-4 bg-white dark:bg-[#1d1f21] rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden relative z-10 shadow-sm dark:shadow-none">

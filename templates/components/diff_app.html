    <!-- Diff App Container -->
    <div id="app-diff" class="flex-1 flex flex-col overflow-hidden w-full h-full absolute inset-0 bg-white dark:bg-[#0a0c10] transition-opacity duration-300 opacity-0 pointer-events-none z-0">
        <header class="app-header h-16 px-3 sm:px-10 flex items-center border-b border-gray-200 dark:border-dark-700 glass gap-2">
            <!-- Show sidebar: visible when sidebar is collapsed -->
            <button id="show-sidebar-diff"
                class="show-sidebar-btn hidden flex-shrink-0 p-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-dark-700 rounded-lg transition-colors"
                aria-label="Show sidebar">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
                </svg>
            </button>
            <button id="mobile-diff-menu-btn"
                class="sm:hidden flex-shrink-0 p-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-dark-700 rounded-lg transition-colors"
                aria-label="Open menu">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <div class="flex-1 flex items-center min-w-0 ml-2 sm:ml-0">
                <input type="text" id="diff-title"
                    class="bg-transparent text-lg sm:text-2xl font-bold text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 outline-none w-full transition-colors focus:border-b border-indigo-500 pb-1"
                    placeholder="Untitled Diff..." autocomplete="off">
            </div>
            <div class="flex items-center gap-1.5 sm:gap-3 ml-2 sm:ml-4 flex-shrink-0">
                <span id="diff-status-badge"
                    class="inline-flex px-2 sm:px-3 py-1 text-[10px] sm:text-xs font-medium rounded-full bg-gray-100 dark:bg-dark-700 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-dark-600 shadow-sm transition-all duration-300"
                    style="display:none;">
                    Read Only
                </span>
                <button id="save-diff-btn"
                    class="group relative px-3 sm:px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg shadow-indigo-500/20 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none flex items-center gap-1.5 sm:gap-2 overflow-hidden"
                    disabled>
                    <span class="relative z-10 flex items-center gap-1.5 sm:gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                        </svg>
                        <span class="text-sm font-medium">Save</span>
                    </span>
                    <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
                </button>
            </div>
        </header>
        <div class="flex-1 overflow-y-auto p-4 sm:p-10 flex flex-col gap-4 sm:gap-6 relative">
            <div class="absolute top-[-100px] left-1/2 -translate-x-1/2 w-[500px] h-[300px] bg-indigo-500/5 blur-[120px] rounded-full pointer-events-none"></div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative z-10">
                <div class="flex flex-col gap-1.5 sm:gap-2">
                    <label class="text-xs sm:text-sm font-semibold text-gray-600 dark:text-gray-300"><span class="sm:hidden">Base</span><span class="hidden sm:inline">Base Paste ID / Content</span></label>
                    <div class="flex h-36 sm:h-64 border border-gray-200 dark:border-dark-700 rounded-xl overflow-hidden bg-gray-50 dark:bg-[#16191f] focus-within:ring-1 focus-within:ring-indigo-500">
                        <div id="diff-base-lines" class="w-8 sm:w-12 flex-shrink-0 text-right pr-2 sm:pr-3 py-3 sm:py-4 bg-gray-200/50 dark:bg-dark-800 text-gray-400 dark:text-gray-600 font-mono text-xs sm:text-sm select-none overflow-hidden border-r border-gray-200 dark:border-dark-700 leading-relaxed">1</div>
                        <textarea id="diff-base" class="w-full h-full bg-transparent p-3 sm:p-4 text-xs sm:text-sm font-mono text-gray-800 dark:text-gray-200 focus:outline-none custom-scrollbar resize-none whitespace-pre leading-relaxed" wrap="off" placeholder="Paste ID or raw content..."></textarea>
                    </div>
                </div>
                <div class="flex flex-col gap-1.5 sm:gap-2">
                    <label class="text-xs sm:text-sm font-semibold text-gray-600 dark:text-gray-300"><span class="sm:hidden">Compare</span><span class="hidden sm:inline">Compare Paste ID / Content</span></label>
                    <div class="flex h-36 sm:h-64 border border-gray-200 dark:border-dark-700 rounded-xl overflow-hidden bg-gray-50 dark:bg-[#16191f] focus-within:ring-1 focus-within:ring-indigo-500">
                        <div id="diff-compare-lines" class="w-8 sm:w-12 flex-shrink-0 text-right pr-2 sm:pr-3 py-3 sm:py-4 bg-gray-200/50 dark:bg-dark-800 text-gray-400 dark:text-gray-600 font-mono text-xs sm:text-sm select-none overflow-hidden border-r border-gray-200 dark:border-dark-700 leading-relaxed">1</div>
                        <textarea id="diff-compare" class="w-full h-full bg-transparent p-3 sm:p-4 text-xs sm:text-sm font-mono text-gray-800 dark:text-gray-200 focus:outline-none custom-scrollbar resize-none whitespace-pre leading-relaxed" wrap="off" placeholder="Paste ID or raw content..."></textarea>
                    </div>
                </div>
            </div>

            <div class="flex justify-center relative z-10">
                <button id="run-diff-btn" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg shadow-indigo-500/20 transition-all flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                    Compare
                </button>
            </div>

            <div id="diff-output-container" class="hidden mt-2 sm:mt-4 bg-white dark:bg-[#1d1f21] rounded-xl border border-gray-200 dark:border-gray-800 p-2 sm:p-4 overflow-x-auto relative z-10 shadow-sm dark:shadow-none">
                <pre><code id="diff-output" class="font-mono text-[11px] sm:text-sm"></code></pre>
            </div>
        </div>
    </div> <!-- /app-diff -->

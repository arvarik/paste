    <aside id="sidebar"
        class="w-72 sm:w-80 bg-gray-100 dark:bg-dark-800 border-r border-gray-200 dark:border-dark-700 flex flex-col transition-all duration-300 ease-in-out relative z-10 flex-shrink-0">
        
        <!-- Workspace Switcher Header -->
        <div class="h-16 flex items-center justify-between px-6 border-b border-gray-200 dark:border-dark-700 glass relative z-20">
            
            <div id="workspace-dropdown-btn" class="flex items-center gap-3 cursor-pointer group hover:opacity-80 transition-opacity">
                <div id="workspace-icon"
                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-purple-600 flex items-center justify-center shadow-lg shadow-primary-500/20 flex-shrink-0 transition-all duration-300">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                </div>
                <div class="flex items-center gap-1.5 min-w-0">
                    <h1 id="workspace-title" class="font-bold text-xl tracking-wide text-gray-900 dark:text-white truncate">Paste</h1>
                    <svg class="w-4 h-4 text-gray-500 dark:text-gray-400 flex-shrink-0 transition-transform duration-200" id="workspace-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>

            <!-- Workspace Menu Dropdown -->
            <div id="workspace-menu" class="absolute top-full left-4 mt-2 w-64 bg-white dark:bg-[#16191f] rounded-xl border border-gray-200 dark:border-gray-800 shadow-2xl opacity-0 pointer-events-none transform -translate-y-2 transition-all duration-200 z-50 overflow-hidden">
                <!-- New Item Action -->
                <div class="p-2 border-b border-gray-200 dark:border-gray-800">
                    <button id="new-item-btn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-primary-50 dark:hover:bg-primary-500/10 text-left transition-colors group">
                        <div class="w-8 h-8 rounded bg-emerald-500/10 text-emerald-500 flex items-center justify-center group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        </div>
                        <div class="flex flex-col flex-1">
                            <span id="new-item-label" class="text-sm font-semibold text-gray-900 dark:text-white">New Paste</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400">Create a blank document</span>
                        </div>
                        <span class="text-[10px] text-gray-400 dark:text-gray-500 font-mono">⌘N</span>
                    </button>
                </div>
                <!-- Workspace List -->
                <div class="p-2 space-y-1">
                    <button data-action="switchApp" data-app="paste" class="workspace-menu-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 dark:hover:bg-white/5 text-left transition-colors group">
                        <div class="w-8 h-8 rounded bg-primary-500/10 text-primary-500 flex items-center justify-center group-hover:bg-primary-500 group-hover:text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </div>
                        <div class="flex flex-col flex-1">
                            <span class="text-sm font-semibold text-gray-900 dark:text-white">Paste</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400">Core editor & storage</span>
                        </div>
                        <svg class="w-4 h-4 text-primary-500 hidden workspace-check" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </button>
                    <button data-action="switchApp" data-app="diff" class="workspace-menu-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 dark:hover:bg-white/5 text-left transition-colors group">
                        <div class="w-8 h-8 rounded bg-indigo-500/10 text-indigo-500 flex items-center justify-center group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        </div>
                        <div class="flex flex-col flex-1">
                            <span class="text-sm font-semibold text-gray-900 dark:text-white">Diff</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400">Visual comparison</span>
                        </div>
                        <svg class="w-4 h-4 text-indigo-500 hidden workspace-check" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </button>
                </div>
                <div class="border-t border-gray-200 dark:border-gray-800 p-2 bg-gray-50 dark:bg-white/[0.02]">
                    <div class="flex items-center justify-between px-3 py-1.5 text-xs text-gray-500 dark:text-gray-400">
                        <span>Cmd+K to quick switch</span>
                    </div>
                </div>
            </div>

            <button id="toggle-sidebar"
                class="p-2 text-gray-400 hover:text-gray-800 dark:hover:text-white hover:bg-gray-200 dark:hover:bg-dark-700 rounded-lg transition-colors flex-shrink-0">
                <!-- X icon: mobile only -->
                <svg class="w-5 h-5 sm:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
                <!-- Chevron icon: desktop only -->
                <svg class="w-5 h-5 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
                </svg>
            </button>
        </div>

        <!-- Search Bar -->
        <div class="px-4 py-3 border-b border-gray-200 dark:border-dark-700">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" id="search-input"
                    class="block w-full pl-9 pr-3 py-2 border border-transparent rounded-xl leading-5 bg-gray-200 dark:bg-dark-700 text-gray-900 dark:text-white placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-dark-600 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 sm:text-sm transition-colors"
                    placeholder="Search pastes..." autocomplete="off">
            </div>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar relative">
            <div id="paste-list" class="p-4 space-y-6 absolute inset-0 w-full transition-opacity duration-300">
                <!-- Dynamically populated via JS -->
            </div>
            <div id="diff-list" class="p-4 space-y-6 absolute inset-0 w-full opacity-0 pointer-events-none transition-opacity duration-300">
                <!-- Dynamically populated via JS -->
            </div>
        </div>

        <!-- Footer / Theme Toggle -->
        <div class="p-4 border-t border-gray-200 dark:border-dark-700 flex justify-start items-center glass">
            <button id="theme-toggle" class="p-2 bg-gray-200 dark:bg-dark-700 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-300 dark:hover:bg-dark-600 transition-colors">
                <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9 0 008.354-5.646z"></path>
                </svg>
            </button>
        </div>
    </aside>

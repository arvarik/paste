    <div id="cmdk-palette" class="fixed inset-0 z-[100] flex items-start justify-center pt-[10vh] sm:pt-[20vh] opacity-0 pointer-events-none transition-opacity duration-200">
        <!-- Backdrop -->
        <div id="cmdk-backdrop" class="absolute inset-0 bg-gray-900/40 dark:bg-black/60 backdrop-blur-sm"></div>
        
        <!-- Modal -->
        <div class="relative w-11/12 max-w-xl bg-white dark:bg-[#16191f] rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-800 overflow-hidden transform scale-95 transition-transform duration-200" id="cmdk-modal">
            <div class="flex items-center px-4 border-b border-gray-200 dark:border-gray-800">
                <svg class="w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="cmdk-input" class="w-full bg-transparent px-4 py-4 text-gray-900 dark:text-white placeholder-gray-500 outline-none text-lg" placeholder="Search commands, workspaces...">
                <div class="flex items-center gap-1 text-[10px] font-mono text-gray-400 dark:text-gray-500 font-medium">
                    <kbd class="px-1.5 py-0.5 rounded border border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-dark-800">ESC</kbd> to close
                </div>
            </div>
            <div class="max-h-[60vh] overflow-y-auto p-2" id="cmdk-results">
                <!-- Workspaces -->
                <div class="px-3 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Workspaces</div>
                <button data-cmd="app:paste" class="cmdk-item w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 text-left transition-colors focus:bg-gray-100 dark:focus:bg-white/5 focus:outline-none">
                    <div class="w-8 h-8 rounded bg-primary-500/10 text-primary-500 flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    </div>
                    <span class="text-sm font-medium text-gray-900 dark:text-white">Paste Editor</span>
                </button>
                <button data-cmd="app:diff" class="cmdk-item w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 text-left transition-colors focus:bg-gray-100 dark:focus:bg-white/5 focus:outline-none">
                    <div class="w-8 h-8 rounded bg-indigo-500/10 text-indigo-500 flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                    </div>
                    <span class="text-sm font-medium text-gray-900 dark:text-white">Diff</span>
                </button>

                <!-- Actions -->
                <div class="px-3 py-2 mt-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</div>
                <button data-cmd="action:format" class="cmdk-item w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 text-left transition-colors focus:bg-gray-100 dark:focus:bg-white/5 focus:outline-none">
                    <div class="w-8 h-8 rounded bg-gray-200 dark:bg-dark-700 text-gray-500 dark:text-gray-400 flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16"></path></svg>
                    </div>
                    <span class="text-sm font-medium text-gray-900 dark:text-white flex-1">Format Code</span>
                    <span class="text-xs text-gray-400 dark:text-gray-500">Cmd+Shift+F</span>
                </button>
                <button data-cmd="action:new" class="cmdk-item w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 text-left transition-colors focus:bg-gray-100 dark:focus:bg-white/5 focus:outline-none">
                    <div class="w-8 h-8 rounded bg-gray-200 dark:bg-dark-700 text-gray-500 dark:text-gray-400 flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </div>
                    <span class="text-sm font-medium text-gray-900 dark:text-white flex-1">New Paste</span>
                    <span class="text-xs text-gray-400 dark:text-gray-500">Cmd+N</span>
                </button>
            </div>
        </div>
    </div>

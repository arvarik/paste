services:
  paste:
    build: .
    image: paste:local
    ports:
      - "127.0.0.1:${PASTE_PORT:-8083}:8083"
    environment:
      DATA_DIR: /app/data
      PASTE_ADMIN_TOKEN: "${PASTE_ADMIN_TOKEN:-}"
      PASTE_ADMIN_TOKEN_FILE: "${PASTE_ADMIN_TOKEN_FILE:-}"
      PASTE_MAX_ITEMS: "${PASTE_MAX_ITEMS:-10000}"
      PASTE_MAX_STORAGE: "${PASTE_MAX_STORAGE:-1GiB}"
      PASTE_MAX_ITEM_SIZE: "${PASTE_MAX_ITEM_SIZE:-2MiB}"
      PASTE_CONTENT_CACHE: "${PASTE_CONTENT_CACHE:-64MiB}"
      PASTE_SEARCH_INDEX: "${PASTE_SEARCH_INDEX:-64MiB}"
      PASTE_PREVIEW_CACHE: "${PASTE_PREVIEW_CACHE:-64MiB}"
      PASTE_BACKUP_LIMIT: "${PASTE_BACKUP_LIMIT:-2GiB}"
      PASTE_RATE_ANONYMOUS_PER_MINUTE: "${PASTE_RATE_ANONYMOUS_PER_MINUTE:-120}"
      PASTE_RATE_AUTHENTICATED_PER_MINUTE: "${PASTE_RATE_AUTHENTICATED_PER_MINUTE:-600}"
      PASTE_RATE_BURST: "${PASTE_RATE_BURST:-30}"
      PASTE_CREATE_LIMIT_PER_HOUR: "${PASTE_CREATE_LIMIT_PER_HOUR:-60}"
      PASTE_REQUIRE_TOKEN_FOR_CREATE: "${PASTE_REQUIRE_TOKEN_FOR_CREATE:-false}"
      PASTE_DEFAULT_EXPIRY: "${PASTE_DEFAULT_EXPIRY:-0s}"
      PASTE_MAX_EXPIRY: "${PASTE_MAX_EXPIRY:-8760h}"
      PASTE_DIFF_WORKERS: "${PASTE_DIFF_WORKERS:-2}"
      PASTE_FORMAT_WORKERS: "${PASTE_FORMAT_WORKERS:-2}"
      PASTE_PREVIEW_WORKERS: "${PASTE_PREVIEW_WORKERS:-2}"
      PASTE_WORK_WAIT_TIMEOUT: "${PASTE_WORK_WAIT_TIMEOUT:-2s}"
      PASTE_TRUSTED_PROXIES: "${PASTE_TRUSTED_PROXIES:-}"
    volumes:
      - paste-data:/app/data
      # Mount a secret file when PASTE_ADMIN_TOKEN_FILE points inside the container.
      # - "./secrets/admin-token:/run/secrets/paste-admin-token:ro"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 100
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8083/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  paste-data:
